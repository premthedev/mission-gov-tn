name: Android APK

# Build any time: Actions → "Android APK" → Run workflow. Each run publishes a new Release with the APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.2.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions). Values are in android-release.secrets.txt on your laptop."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install and build web app
        run: |
          npm ci
          npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          node tools/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.RELEASE_TAG }}

      - name: Build signed release APK
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "MissionGOV-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: MissionGOV-apk
          path: MissionGOV-*.apk

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Mission GOV ${{ env.RELEASE_TAG }}
          files: MissionGOV-*.apk
          make_latest: true
          body: |
            Install: open this page on your phone, tap the .apk, allow "Install unknown apps" for your browser once.
            Updating keeps your progress (same signing key). New lessons and questions also arrive inside the app without reinstalling.
