name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install and build web app
        run: |
          npm ci
          npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          node tools/patch-android.mjs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD as repository secrets (see README)."
            exit 1
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "MissionGOV-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: MissionGOV-apk
          path: MissionGOV-*.apk

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MissionGOV-*.apk
          body: |
            Install: open this page on your phone, tap the .apk, allow "Install unknown apps" for your browser once.
            Updating keeps your progress (same signing key).
